<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Install {{APP_NAME}}</title>
    <link rel="manifest" href="/__grok/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
    <meta name="theme-color" content="#f2eee4" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f2eee4;
        color: #201c16;
        font-family:
          "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 2.5rem 1.5rem;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 1px 0 rgba(32, 28, 22, 0.15);
      }
      h1 {
        font-size: 1.5rem;
        margin: 1.25rem 0 0.5rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.55;
        color: #4a4438;
      }
      a.cta {
        display: inline-flex;
        margin-top: 1.5rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.5rem;
        background: #201c16;
        color: #f2eee4;
        text-decoration: none;
        font-size: 0.95rem;
      }
      code {
        background: rgba(32, 28, 22, 0.08);
        padding: 0.1rem 0.35rem;
        border-radius: 0.3rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/__grok/icon-180.png" alt="{{APP_NAME}} icon" />
      <h1>Install {{APP_NAME}}</h1>
      <p>
        Add <strong>{{APP_NAME}}</strong> to your home screen for a full-screen,
        app-like experience.
      </p>
      <p>
        On iOS, tap <strong>Share</strong> then
        <strong>Add to Home Screen</strong>. On Android/desktop Chrome, use
        <strong>Install app</strong> from the browser menu.
      </p>
      <a class="cta" href="{{CANONICAL_URL}}">Open {{APP_NAME}}</a>
    </main>
  </body>
</html>
